<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link rel="icon" type="image/png" sizes="32x32" href="etrigantoy .png">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            
            
        }

        button, a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            
            background: hsla(211, 100%, 50%, 0);;
            background-image: url('green dots.png'); 
  background-size: cover; 
  background-position: center; 
  background-repeat: no-repeat;
            color: white;
            text-decoration: none;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            border: none;
            border-radius: 5px;
        }


        #container { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        .sidenav {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
 
  background-image: url('yellow space.png'); 
  background-size: cover; 
  background-position: center; 
  background-repeat: no-repeat; 
 
 
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
  text-align:center;
}

.sidenav a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidenav a:hover {
  color: #f1f1f1;
  background-color: rgba(0, 0, 0, 0.3); 
}

.sidenav .closebtn {
  position: absolute;
  top: 0;
  right: 25px;
  font-size: 36px;
  margin-left: 50px;
  background-color: transparent; 
}


.sidenav::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.5); 
  z-index: -1; 
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

.icon {
    background: url('green master.png');
    height: 20px;
    width: 20px;
    display: block;
  
}


    </style>
</head>
<body>

    
      <span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776;</span>

      
      <span class='icon'></span>

     
    <div id="container"></div>
    <div id="loading">LOADING CUBE...</div>

   
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Wait for the page to load
        document.addEventListener('DOMContentLoaded', () => {
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdddddd);
            
            // Camera setup
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            
            // Renderer setup
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Add orbit controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            
            
            // Load GLTF model
            const loader = new THREE.GLTFLoader();
            
            
            // MY 3D MODEL FILE - JCUBE1.glb (here i can add and explore other 3d models i have made)
            const modelUrl = 'Jcube1.glb';
            
            loader.load(
                modelUrl,
                (gltf) => {
                    const model = gltf.scene;
                    scene.add(model);
                    
                    // Center the model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.x += (model.position.x - center.x);
                    model.position.y += (model.position.y - center.y);
                    model.position.z += (model.position.z - center.z);
                    
                    // Hide loading message
                    document.getElementById('loading').style.display = 'none';
                },
                (xhr) => {
                    // Progress callback
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                (error) => {
                    // Error callback
                    console.error('Error loading model', error);
                    document.getElementById('loading').textContent = 'Error loading model';
                }
            );
            



            const textureLoader = new THREE.TextureLoader();
        textureLoader.load('etrigantoy .png', function(texture) {
            scene.background = texture;
        });

 

            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            
            animate();
        });
    </script>



<script>
function openNav() {
    document.getElementById("mySidenav").style.width = "50%";
  }
  
  function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
  }

  function playaudio() {
    const audio = document.getElementById('myAudio')
    audio.play();
} 
</script>

</body>
</html>
